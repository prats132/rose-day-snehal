<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Rose Day Snehal 🌹</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ffd6e8,#fff);
  font-family:'Poppins',sans-serif;
}
.card{
  background:white;
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,0.1);
  max-width:360px;
  position:relative;
}
.photo{
  width:100%;
  border-radius:15px;
  margin-bottom:15px;
}
h1{color:#e6005c;}
h2{color:#ff4d88;}
p{color:#444;font-size:15px;}
button{
  margin-top:18px;
  padding:12px 22px;
  border:none;
  border-radius:30px;
  background:#e6005c;
  color:white;
  font-size:16px;
  cursor:pointer;
}
#surprise{
  display:none;
  margin-top:15px;
  color:#e6005c;
  font-weight:600;
}
.music-btn{
  position:absolute;
  top:15px;
  right:15px;
  background:#ff4d88;
  border:none;
  border-radius:50%;
  width:38px;
  height:38px;
  color:white;
  font-size:16px;
  cursor:pointer;
}
.heart{
  position:fixed;
  color:#ff4d88;
  animation:float 5s linear infinite;
}
@keyframes float{
  0%{bottom:-10px; opacity:0;}
  50%{opacity:1;}
  100%{bottom:100%; opacity:0;}
}
</style>
</head>
<body>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/03/audio_8b4a7f48a6.mp3" type="audio/mp3">
</audio>

<div class="card">
  <button class="music-btn" onclick="toggleMusic()">🎵</button>

  <img src="us.jpg" class="photo" alt="Us together">

  <h1>Happy Rose Day 🌹</h1>
  <h2>Snehal ❤️</h2>

  <p>
    Distance may keep us apart,<br>
    but my heart always finds you.<br><br>
    This rose is my promise —<br>
    I choose you, today and always.
  </p>

  <button onclick="showLove()">This rose is for you 🌹</button>
  <div id="surprise">You are my favorite feeling 💕</div>
</div>

<script>
const music = document.getElementById("bgm");
let playing = false;

function toggleMusic(){
  if(!playing){
    music.play();
    playing = true;
  }else{
    music.pause();
    playing = false;
  }
}

function showLove(){
  document.getElementById("surprise").style.display="block";
  music.play();
  playing = true;
  for(let i=0;i<20;i++){
    let heart=document.createElement("div");
    heart.innerHTML="💗";
    heart.className="heart";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
  }
}
</script>

</body>
</html>
